version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: dojin_management_db
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dojin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dojin_password}
      POSTGRES_DB: ${POSTGRES_DB:-dojin_management}
      TZ: Asia/Tokyo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro

volumes:
  postgres_data:
    driver: local